<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가계부</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e8e9ec; --muted: #9aa1af; --accent: #4f8cff;
    --green: #34c77b; --red: #ff5d5d; --amber: #f5b942;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif; padding: 20px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
  .icon-btn-group { display: flex; gap: 6px; }
  .icon-btn { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--muted); cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .field { flex: 1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  input, select {
    width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-size: 15px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 12px 18px;
    font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { opacity: 0.9; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2);
    color: var(--muted); cursor: pointer; font-size: 14px; font-weight: 600; text-align: center; }
  .tab.active { background: rgba(79,140,255,0.15); border-color: var(--accent); color: var(--accent); }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
  .type-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2);
    color: var(--muted); text-align: center; cursor: pointer; font-size: 14px; font-weight: 600; }
  .type-btn.active.expense { background: rgba(255,93,93,0.15); border-color: var(--red); color: var(--red); }
  .type-btn.active.income { background: rgba(52,199,123,0.15); border-color: var(--green); color: var(--green); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat-grid.three { grid-template-columns: 1fr 1fr 1fr; }
  .stat { background: var(--panel2); border-radius: 10px; padding: 12px; text-align: center; }
  .stat .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .stat .value { font-size: 16px; font-weight: 700; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .month-nav button { width: auto; padding: 8px 14px; }
  .month-nav .month-label { font-size: 16px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
  .cat-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: rgba(154,161,175,0.15); color: var(--text); }
  .amt-expense { color: var(--red); font-weight: 600; }
  .amt-income { color: var(--green); font-weight: 600; }
  .setup-note { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; }
  .chart-wrap { position: relative; height: 220px; }
  .chart-wrap.tall { height: 260px; }
  .tablewrap { overflow-y: auto; max-height: 360px; border: 1px solid var(--border); border-radius: 8px; }
  .tablewrap table { margin: 0; }
  .tablewrap thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .del-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; width: auto; padding: 2px 6px; font-size: 14px; }
  .del-btn:hover { color: var(--red); }
  .cat-summary-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .cat-summary-row:last-child { border-bottom: none; }
  .bar-bg { height: 6px; border-radius: 4px; background: var(--panel2); overflow: hidden; margin-top: 4px; }
  .bar-fill { height: 100%; border-radius: 4px; background: var(--accent); }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const APP_VERSION = '2.0';
const STORAGE_KEY = 'budget_state_v3';
let state = null;
let chartInstance = null;
let trendChartInstance = null;
let catTrendChartInstance = null;
let currentType = 'expense';
let activeTab = 'home';
let editingId = null;

const EXPENSE_CATEGORIES_DEFAULT = ['식비','주거비','교통비','통신비','의료비','생활비','용돈','저축/투자','기타'];
const INCOME_CATEGORIES = ['급여','부수입','용돈받음','환급/이자','기타'];
const PAYMENT_METHODS = ['카드','현금','계좌이체'];

function fmt(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }
function todayStr() {
  const d = new Date();
  return todayStrFrom(d);
}
function todayStrFrom(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) { state = null; }
  if (!state) state = { transactions: [], expenseCategories: EXPENSE_CATEGORIES_DEFAULT.slice() };
  if (!state.expenseCategories) state.expenseCategories = EXPENSE_CATEGORIES_DEFAULT.slice();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.error('저장 실패', e); }
}

let viewYear, viewMonth;
(function initMonth() {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth() + 1;
})();

function monthKey(y, m) { return `${y}-${String(m).padStart(2,'0')}`; }

function render() {
  const app = document.getElementById('app');
  app.innerHTML = renderShell();
  attachHandlers();
  if (activeTab === 'home') drawCatChart();
  if (activeTab === 'trend') { drawTrendChart(); drawCatTrendChart(); }
}

function getMonthTransactions(y, m) {
  const key = monthKey(y, m);
  return state.transactions.filter(t => t.date.slice(0,7) === key);
}

function renderShell() {
  return `
    <div class="top-bar">
      <div>
        <h1>가계부</h1>
        <div class="sub">수입·지출 기록과 추이 확인 <span style="opacity:0.6;">· v${APP_VERSION}</span></div>
      </div>
      <div class="icon-btn-group">
        <button class="icon-btn" id="export-btn" title="백업 내보내기">⬇</button>
        <button class="icon-btn" id="import-btn" title="백업 불러오기">⬆</button>
      </div>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none;">
    <div id="import-msg" class="setup-note" style="text-align:right; margin-top:-14px; margin-bottom:10px;"></div>
    <div class="tabs">
      <div class="tab ${activeTab==='home'?'active':''}" data-tab="home">내역</div>
      <div class="tab ${activeTab==='trend'?'active':''}" data-tab="trend">추이</div>
    </div>
    ${activeTab === 'home' ? renderHome() : ''}
    ${activeTab === 'trend' ? renderTrend() : ''}
  `;
}

function renderHome() {
  const txs = getMonthTransactions(viewYear, viewMonth).slice().sort((a,b) => b.date.localeCompare(a.date));
  const income = txs.filter(t => t.type === 'income').reduce((s,t) => s+t.amount, 0);
  const expense = txs.filter(t => t.type === 'expense').reduce((s,t) => s+t.amount, 0);
  const net = income - expense;
  const netColor = net >= 0 ? 'var(--green)' : 'var(--red)';

  const rows = txs.map(t => `
    <tr>
      <td>${t.date.slice(5)}</td>
      <td><span class="cat-tag">${t.category}</span></td>
      <td>${t.type === 'expense' ? (t.method || '-') : '-'}</td>
      <td>${t.memo || '-'}</td>
      <td class="${t.type === 'expense' ? 'amt-expense' : 'amt-income'}">${t.type === 'expense' ? '-' : '+'}${fmt(t.amount)}</td>
      <td>
        <button class="del-btn" data-edit-id="${t.id}">✎</button>
        <button class="del-btn" data-id="${t.id}">✕</button>
      </td>
    </tr>
  `).join('');

  const editingTx = editingId ? state.transactions.find(t => t.id === editingId) : null;
  const selectedCat = editingTx ? editingTx.category : null;
  const catOptions = (currentType === 'expense' ? state.expenseCategories : INCOME_CATEGORIES)
    .map(c => `<option value="${c}" ${c===selectedCat?'selected':''}>${c}</option>`).join('');

  const selectedMethod = editingTx ? (editingTx.method || '카드') : '카드';
  const methodOptions = PAYMENT_METHODS.map(mth => `<option value="${mth}" ${mth===selectedMethod?'selected':''}>${mth}</option>`).join('');

  const formDate = editingTx ? editingTx.date : todayStr();
  const formAmount = editingTx ? editingTx.amount : '';
  const formMemo = editingTx ? (editingTx.memo || '') : '';

  return `
    <div class="card">
      <div class="month-nav">
        <button class="secondary" id="prev-month">◀</button>
        <div class="month-label">${viewYear}년 ${viewMonth}월</div>
        <button class="secondary" id="next-month">▶</button>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="label">수입</div><div class="value" style="color:var(--green)">${fmt(income)}</div></div>
        <div class="stat"><div class="label">지출</div><div class="value" style="color:var(--red)">${fmt(expense)}</div></div>
        <div class="stat"><div class="label">순액</div><div class="value" style="color:${netColor}">${net>=0?'+':''}${fmt(net)}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>${editingTx ? '기록 수정' : '기록 추가'}</h2>
      <div class="type-toggle">
        <div class="type-btn expense ${currentType==='expense'?'active expense':''}" id="type-expense">지출</div>
        <div class="type-btn income ${currentType==='income'?'active income':''}" id="type-income">수입</div>
      </div>
      <div class="row">
        <div class="field"><label>날짜</label><input type="date" id="tx-date" value="${formDate}"></div>
        <div class="field"><label>카테고리</label><select id="tx-category">${catOptions}</select></div>
      </div>
      <div class="row">
        <div class="field"><label>금액</label><input type="number" id="tx-amount" placeholder="예: 50000" value="${formAmount}"></div>
        <div class="field"><label>메모 (선택)</label><input type="text" id="tx-memo" placeholder="예: 마트 장보기" value="${formMemo}"></div>
      </div>
      ${currentType === 'expense' ? `
      <div class="row">
        <div class="field"><label>결제수단</label><select id="tx-method">${methodOptions}</select></div>
      </div>` : ''}
      <button id="add-btn">${editingTx ? '수정 저장하기' : '추가하기'}</button>
      ${editingTx ? '<button class="secondary" id="cancel-edit-btn" style="margin-top:8px;">수정 취소</button>' : ''}
      <div id="add-error" class="err"></div>
    </div>

    <div class="card">
      <h2>카테고리별 지출</h2>
      <div class="chart-wrap"><canvas id="cat-chart"></canvas></div>
    </div>

    <div class="card">
      <h2>이번 달 내역</h2>
      ${txs.length === 0 ? '<div class="empty">이번 달 기록이 없어요</div>' : `
      <div class="tablewrap">
      <table>
        <thead><tr><th>날짜</th><th>분류</th><th>결제</th><th>메모</th><th>금액</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>`}
    </div>

    <div class="card">
      <h2>카테고리 추가</h2>
      <div class="row">
        <div class="field"><input type="text" id="new-cat-input" placeholder="예: 반려동물"></div>
        <button id="add-cat-btn" style="flex:0 0 auto; width:auto; padding:10px 16px;">추가</button>
      </div>
      <div id="cat-error" class="err"></div>
    </div>
  `;
}

function renderTrend() {
  return `
    <div class="card">
      <h2>최근 12개월 수입·지출 추이</h2>
      <div class="chart-wrap tall"><canvas id="trend-chart"></canvas></div>
    </div>
    <div class="card">
      <h2>카테고리별 지출 추이 (최근 6개월)</h2>
      <div class="chart-wrap tall"><canvas id="cat-trend-chart"></canvas></div>
    </div>
    <div class="card" id="cat-summary-card">
      <h2>카테고리별 평균 지출 (최근 6개월)</h2>
      <div id="cat-summary-list"></div>
    </div>
  `;
}

function drawCatChart() {
  const ctx = document.getElementById('cat-chart');
  if (!ctx) return;
  const txs = getMonthTransactions(viewYear, viewMonth).filter(t => t.type === 'expense');
  const byCat = {};
  txs.forEach(t => { byCat[t.category] = (byCat[t.category]||0) + t.amount; });
  const labels = Object.keys(byCat);
  const data = Object.values(byCat);
  const colors = ['#4f8cff','#ff5d5d','#34c77b','#f5b942','#a78bfa','#f472b6','#38bdf8','#fb923c','#94a3b8'];

  if (chartInstance) chartInstance.destroy();
  if (labels.length === 0) return;

  chartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#e8e9ec', font: { size: 11 }, boxWidth: 12 } },
        tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${fmt(ctx.parsed)}` } }
      }
    }
  });
}

function getLastNMonths(n) {
  const months = [];
  let y = viewYear, m = viewMonth;
  for (let i = 0; i < n; i++) {
    months.unshift({y, m});
    m--; if (m < 1) { m = 12; y--; }
  }
  return months;
}

function drawTrendChart() {
  const ctx = document.getElementById('trend-chart');
  if (!ctx) return;
  const months = getLastNMonths(12);
  const labels = months.map(({y,m}) => `${y}.${m}`);
  const incomeData = [];
  const expenseData = [];
  const netData = [];
  months.forEach(({y,m}) => {
    const txs = getMonthTransactions(y, m);
    const inc = txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
    const exp = txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
    incomeData.push(inc);
    expenseData.push(exp);
    netData.push(inc-exp);
  });

  if (trendChartInstance) trendChartInstance.destroy();
  trendChartInstance = new Chart(ctx, {
    data: {
      labels,
      datasets: [
        { type: 'bar', label: '수입', data: incomeData, backgroundColor: 'rgba(52,199,123,0.7)' },
        { type: 'bar', label: '지출', data: expenseData, backgroundColor: 'rgba(255,93,93,0.7)' },
        { type: 'line', label: '순액', data: netData, borderColor: '#f5b942', backgroundColor: 'transparent', tension: 0.3, borderWidth: 2, pointRadius: 3 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#e8e9ec', font: { size: 11 } } },
        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` } }
      },
      scales: {
        x: { ticks: { color: '#9aa1af', font: { size: 10 } }, grid: { color: '#2a2f3a' } },
        y: { ticks: { color: '#9aa1af', font: { size: 10 } }, grid: { color: '#2a2f3a' } }
      }
    }
  });
}

function drawCatTrendChart() {
  const ctx = document.getElementById('cat-trend-chart');
  if (!ctx) return;
  const months = getLastNMonths(6);
  const labels = months.map(({y,m}) => `${y}.${m}`);

  // 6개월 합산 지출 상위 5개 카테고리만 선으로 표시
  const totalByCat = {};
  months.forEach(({y,m}) => {
    getMonthTransactions(y,m).filter(t=>t.type==='expense').forEach(t => {
      totalByCat[t.category] = (totalByCat[t.category]||0) + t.amount;
    });
  });
  const topCats = Object.entries(totalByCat).sort((a,b)=>b[1]-a[1]).slice(0,5).map(e=>e[0]);
  const colors = ['#4f8cff','#ff5d5d','#34c77b','#f5b942','#a78bfa'];

  const datasets = topCats.map((cat, idx) => {
    const data = months.map(({y,m}) => {
      const txs = getMonthTransactions(y,m).filter(t=>t.type==='expense' && t.category===cat);
      return txs.reduce((s,t)=>s+t.amount,0);
    });
    return { label: cat, data, borderColor: colors[idx % colors.length], backgroundColor: 'transparent', tension: 0.3, borderWidth: 2, pointRadius: 3 };
  });

  if (catTrendChartInstance) catTrendChartInstance.destroy();

  // 카테고리별 평균 요약 리스트도 같이 그림
  const summaryEl = document.getElementById('cat-summary-list');
  if (summaryEl) {
    const maxAvg = Math.max(...topCats.map(c => totalByCat[c]/6), 1);
    summaryEl.innerHTML = topCats.length === 0 ? '<div class="empty">최근 6개월 지출 기록이 없어요</div>' :
      topCats.map(cat => {
        const avg = totalByCat[cat]/6;
        const pct = (avg/maxAvg)*100;
        return `
          <div class="cat-summary-row">
            <div style="flex:1;">
              <div>${cat}</div>
              <div class="bar-bg"><div class="bar-fill" style="width:${pct}%;"></div></div>
            </div>
            <div style="margin-left:12px; font-weight:700;">${fmt(avg)}/월</div>
          </div>
        `;
      }).join('');
  }

  if (topCats.length === 0) return;

  catTrendChartInstance = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#e8e9ec', font: { size: 11 } } },
        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` } }
      },
      scales: {
        x: { ticks: { color: '#9aa1af', font: { size: 10 } }, grid: { color: '#2a2f3a' } },
        y: { ticks: { color: '#9aa1af', font: { size: 10 } }, grid: { color: '#2a2f3a' } }
      }
    }
  });
}

function attachHandlers() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => { activeTab = tab.dataset.tab; editingId = null; render(); });
  });

  document.getElementById('export-btn').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `budget_backup_${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  document.getElementById('import-btn').onclick = () => document.getElementById('import-file').click();
  document.getElementById('import-file').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const msgEl = document.getElementById('import-msg');
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const loaded = JSON.parse(evt.target.result);
        if (!Array.isArray(loaded.transactions)) { if (msgEl) msgEl.textContent = '올바른 백업 파일이 아니에요.'; return; }
        state = loaded;
        if (!state.expenseCategories) state.expenseCategories = EXPENSE_CATEGORIES_DEFAULT.slice();
        saveState(); render();
      } catch (err) { if (msgEl) msgEl.textContent = '파일을 읽는 중 오류가 발생했어요.'; }
    };
    reader.readAsText(file);
  };

  if (activeTab === 'home') {
    document.getElementById('prev-month').onclick = () => { viewMonth--; if (viewMonth<1){viewMonth=12;viewYear--;} render(); };
    document.getElementById('next-month').onclick = () => { viewMonth++; if (viewMonth>12){viewMonth=1;viewYear++;} render(); };
    document.getElementById('type-expense').onclick = () => { currentType='expense'; render(); };
    document.getElementById('type-income').onclick = () => { currentType='income'; render(); };

    document.getElementById('add-btn').onclick = () => {
      const date = document.getElementById('tx-date').value;
      const category = document.getElementById('tx-category').value;
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const memo = document.getElementById('tx-memo').value.trim();
      const methodEl = document.getElementById('tx-method');
      const method = currentType === 'expense' ? (methodEl ? methodEl.value : '카드') : undefined;
      const errEl = document.getElementById('add-error');
      errEl.textContent = '';
      if (!date) { errEl.textContent = '날짜를 입력해주세요.'; return; }
      if (!amount || amount <= 0) { errEl.textContent = '금액을 입력해주세요.'; return; }

      if (editingId) {
        const tx = state.transactions.find(t => t.id === editingId);
        if (tx) {
          tx.date = date; tx.type = currentType; tx.category = category; tx.amount = amount; tx.memo = memo;
          if (currentType === 'expense') tx.method = method; else delete tx.method;
        }
        editingId = null;
      } else {
        const newTx = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
          date, type: currentType, category, amount, memo
        };
        if (currentType === 'expense') newTx.method = method;
        state.transactions.push(newTx);
      }
      saveState();
      const [y, m] = date.split('-').map(Number);
      viewYear = y; viewMonth = m;
      render();
    };

    if (document.getElementById('cancel-edit-btn')) {
      document.getElementById('cancel-edit-btn').onclick = () => { editingId = null; render(); };
    }

    document.querySelectorAll('.del-btn[data-edit-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tx = state.transactions.find(t => t.id === btn.dataset.editId);
        if (tx) { editingId = tx.id; currentType = tx.type; render(); }
      });
    });

    document.querySelectorAll('.del-btn[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.transactions = state.transactions.filter(t => t.id !== btn.dataset.id);
        if (editingId === btn.dataset.id) editingId = null;
        saveState(); render();
      });
    });

    document.getElementById('add-cat-btn').onclick = () => {
      const input = document.getElementById('new-cat-input');
      const name = input.value.trim();
      const errEl = document.getElementById('cat-error');
      errEl.textContent = '';
      if (!name) { errEl.textContent = '카테고리 이름을 입력해주세요.'; return; }
      if (state.expenseCategories.includes(name)) { errEl.textContent = '이미 있는 카테고리예요.'; return; }
      state.expenseCategories.push(name);
      saveState(); render();
    };
  }
}

loadState();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => console.log('SW 등록 실패', err));
  });
}
</script>
</body>
</html>
