<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가계부</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --border: #2a2f3a;
    --text: #e8e9ec; --muted: #9aa1af; --accent: #4f8cff;
    --green: #34c77b; --red: #ff5d5d; --amber: #f5b942;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", "Malgun Gothic", sans-serif; padding: 20px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; }
  .field { flex: 1; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  input, select {
    width: 100%; background: var(--panel2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; color: var(--text); font-size: 15px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  button { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 12px 18px;
    font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
  button:hover { opacity: 0.9; }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  button.small { width: auto; padding: 6px 12px; font-size: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; }
  .tab { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2);
    color: var(--muted); cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .tab.active { background: rgba(79,140,255,0.15); border-color: var(--accent); color: var(--accent); }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 10px; }
  .type-btn { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel2);
    color: var(--muted); text-align: center; cursor: pointer; font-size: 14px; font-weight: 600; }
  .type-btn.active.expense { background: rgba(255,93,93,0.15); border-color: var(--red); color: var(--red); }
  .type-btn.active.income { background: rgba(52,199,123,0.15); border-color: var(--green); color: var(--green); }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .stat { background: var(--panel2); border-radius: 10px; padding: 12px; text-align: center; }
  .stat .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .stat .value { font-size: 16px; font-weight: 700; }
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .month-nav button { width: auto; padding: 8px 14px; }
  .month-nav .month-label { font-size: 16px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
  .cat-tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: rgba(154,161,175,0.15); color: var(--text); }
  .amt-expense { color: var(--red); font-weight: 600; }
  .amt-income { color: var(--green); font-weight: 600; }
  .setup-note { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
  .err { color: var(--red); font-size: 13px; margin-top: 8px; }
  .chart-wrap { position: relative; height: 220px; }
  .chart-wrap.small { height: 180px; }
  .tablewrap { overflow-y: auto; max-height: 360px; border: 1px solid var(--border); border-radius: 8px; }
  .tablewrap table { margin: 0; }
  .tablewrap thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .del-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; width: auto; padding: 2px 6px; font-size: 14px; }
  .del-btn:hover { color: var(--red); }
  .budget-row { margin-bottom: 14px; }
  .budget-row .top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .budget-row .bar-bg { height: 8px; border-radius: 5px; background: var(--panel2); overflow: hidden; }
  .budget-row .bar-fill { height: 100%; border-radius: 5px; transition: width 0.3s; }
  .recurring-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .recurring-item:last-child { border-bottom: none; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
  .icon-btn-group { display: flex; gap: 6px; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel2); color: var(--muted); cursor: pointer; font-size: 15px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .banner { background: rgba(245,185,66,0.12); border: 1px solid rgba(245,185,66,0.4); color: var(--amber);
    border-radius: 10px; padding: 12px; font-size: 13px; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const STORAGE_KEY = 'budget_state_v2';
let state = null;
let chartInstance = null;
let trendChartInstance = null;
let currentType = 'expense';
let activeTab = 'today';
let editingId = null;

const EXPENSE_CATEGORIES_DEFAULT = ['식비','주거비','교통비','통신비','의료비','생활비','용돈','저축/투자','기타'];
const INCOME_CATEGORIES = ['급여','부수입','용돈받음','환급/이자','기타'];
const PAYMENT_METHODS = ['카드','현금','계좌이체'];

function fmt(n) { return Math.round(n).toLocaleString('ko-KR') + '원'; }

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch (e) { state = null; }
  if (!state) state = { transactions: [], budgets: {}, recurring: [], expenseCategories: EXPENSE_CATEGORIES_DEFAULT.slice() };
  if (!state.budgets) state.budgets = {};
  if (!state.recurring) state.recurring = [];
  if (!state.expenseCategories) state.expenseCategories = EXPENSE_CATEGORIES_DEFAULT.slice();
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch (e) { console.error('저장 실패', e); }
}

let viewYear, viewMonth;
(function initMonth() {
  const now = new Date();
  viewYear = now.getFullYear();
  viewMonth = now.getMonth() + 1;
})();

function monthKey(y, m) { return `${y}-${String(m).padStart(2,'0')}`; }
function todayStr() { return new Date().toISOString().slice(0,10); }

// 고정비 자동 등록: 이번(실제 오늘 기준) 달에서, day가 지난 고정비 중 아직 이번 달에 반영 안 된 게 있으면 자동 추가
function applyRecurring() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  const lastDay = new Date(y, m, 0).getDate(); // 이번 달 실제 마지막 날
  const key = monthKey(y, m);
  let added = false;
  state.recurring.forEach(r => {
    const effectiveDay = Math.min(r.day, lastDay); // 31로 등록했어도 그 달 마지막 날로 자동 보정
    if (effectiveDay > d) return; // 아직 그 날짜가 안 됨
    const exists = state.transactions.some(t => t.recurringId === r.id && t.date.slice(0,7) === key);
    if (!exists) {
      const dateStr = `${key}-${String(effectiveDay).padStart(2,'0')}`;
      state.transactions.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        date: dateStr, type: 'expense', category: r.category, amount: r.amount,
        memo: r.memo || '(고정비 자동등록)', recurringId: r.id, method: '계좌이체'
      });
      added = true;
    }
  });
  if (added) saveState();
}

function render() {
  const app = document.getElementById('app');
  app.innerHTML = renderShell();
  attachHandlers();
  if (activeTab === 'home') drawCatChart();
  if (activeTab === 'trend') drawTrendChart();
}

function getMonthTransactions(y, m) {
  const key = monthKey(y, m);
  return state.transactions.filter(t => t.date.slice(0,7) === key);
}

function renderShell() {
  return `
    <div class="top-bar">
      <div>
        <h1>가계부</h1>
        <div class="sub">수입·지출 기록, 예산, 고정비, 추이까지 한 번에</div>
      </div>
      <div class="icon-btn-group">
        <button class="icon-btn" id="export-btn" title="백업 내보내기">⬇</button>
        <button class="icon-btn" id="import-btn" title="백업 불러오기">⬆</button>
      </div>
    </div>
    <input type="file" id="import-file" accept=".json" style="display:none;">
    <div id="import-msg" class="setup-note" style="text-align:right; margin-top:-14px; margin-bottom:10px;"></div>
    <div class="tabs">
      <div class="tab ${activeTab==='today'?'active':''}" data-tab="today">오늘</div>
      <div class="tab ${activeTab==='home'?'active':''}" data-tab="home">내역</div>
      <div class="tab ${activeTab==='budget'?'active':''}" data-tab="budget">예산</div>
      <div class="tab ${activeTab==='recurring'?'active':''}" data-tab="recurring">고정비</div>
      <div class="tab ${activeTab==='trend'?'active':''}" data-tab="trend">추이</div>
    </div>
    ${activeTab === 'today' ? renderToday() : ''}
    ${activeTab === 'home' ? renderHome() : ''}
    ${activeTab === 'budget' ? renderBudget() : ''}
    ${activeTab === 'recurring' ? renderRecurring() : ''}
    ${activeTab === 'trend' ? renderTrend() : ''}
  `;
}

function getTodayMessage(spent, goal) {
  if (!goal || goal <= 0) {
    return { emoji: '📝', text: '목표를 설정해보세요', color: 'var(--muted)' };
  }
  const pct = (spent / goal) * 100;
  if (spent === 0) {
    return { emoji: '🌱', text: '아직 오늘 지출이 없어요, 좋아요!', color: 'var(--green)' };
  }
  if (pct <= 50) {
    return { emoji: '🏆', text: '완벽해요! 목표의 절반도 안 썼어요', color: 'var(--green)' };
  }
  if (pct <= 80) {
    return { emoji: '👍', text: '굿! 여유 있게 잘 쓰고 있어요', color: 'var(--green)' };
  }
  if (pct <= 100) {
    return { emoji: '✅', text: '목표 안에서 딱 맞췄어요', color: 'var(--amber)' };
  }
  if (pct <= 120) {
    return { emoji: '💪', text: '살짝 넘었지만 괜찮아요, 내일 다시 화이팅', color: 'var(--amber)' };
  }
  return { emoji: '🌤️', text: '오늘은 좀 썼지만 내일 다시 시작하면 돼요', color: 'var(--red)' };
}

function renderToday() {
  const today = todayStr();
  const todayTxs = state.transactions.filter(t => t.date === today && t.type === 'expense');
  const spent = todayTxs.reduce((s,t) => s+t.amount, 0);
  const goal = state.dailyGoal || 0;
  const msg = getTodayMessage(spent, goal);
  const pct = goal > 0 ? Math.min(100, (spent/goal)*100) : 0;
  const barColor = spent > goal && goal > 0 ? 'var(--red)' : (pct > 80 ? 'var(--amber)' : 'var(--green)');

  // 연속 목표 달성일(스트릭) 계산
  let streak = 0;
  if (goal > 0) {
    const spentByDate = {};
    state.transactions.filter(t => t.type === 'expense').forEach(t => {
      spentByDate[t.date] = (spentByDate[t.date]||0) + t.amount;
    });
    const d = new Date();
    d.setDate(d.getDate() - 1);
    while (true) {
      const key = d.toISOString().slice(0,10);
      if (!(key in spentByDate)) break;
      if (spentByDate[key] <= goal) { streak++; d.setDate(d.getDate()-1); }
      else break;
    }
  }

  const catOptions = state.expenseCategories.map(c => `<option value="${c}">${c}</option>`).join('');
  const methodOptions = PAYMENT_METHODS.map(m => `<option value="${m}">${m}</option>`).join('');

  return `
    <div class="card" style="text-align:center;">
      <h2>${today}</h2>
      <div style="font-size:40px; margin: 10px 0;">${msg.emoji}</div>
      <div style="font-size:16px; font-weight:700; color:${msg.color}; margin-bottom:14px;">${msg.text}</div>
      <div class="stat-grid">
        <div class="stat"><div class="label">오늘 지출</div><div class="value" style="color:var(--red)">${fmt(spent)}</div></div>
        <div class="stat"><div class="label">오늘 목표</div><div class="value">${goal>0?fmt(goal):'미설정'}</div></div>
      </div>
      ${goal > 0 ? `<div class="bar-bg" style="margin-top:14px;"><div class="bar-fill" style="width:${pct}%; background:${barColor};"></div></div>` : ''}
      ${goal > 0 && streak > 0 ? `<div class="setup-note" style="margin-top:10px; font-size:13px;">🔥 목표 달성 연속 ${streak}일째</div>` : ''}
    </div>

    <div class="card">
      <h2>오늘 지출 바로 기록</h2>
      <div class="row">
        <div class="field"><label>카테고리</label><select id="today-category">${catOptions}</select></div>
        <div class="field"><label>결제수단</label><select id="today-method">${methodOptions}</select></div>
      </div>
      <div class="row">
        <div class="field"><label>금액</label><input type="number" id="today-amount" placeholder="예: 12000"></div>
        <div class="field"><label>메모 (선택)</label><input type="text" id="today-memo" placeholder="예: 점심"></div>
      </div>
      <button id="today-add-btn">기록하기</button>
      <div id="today-error" class="err"></div>
    </div>

    <div class="card">
      <h2>오늘 목표 지출액 설정</h2>
      <div class="row">
        <div class="field"><input type="number" id="daily-goal-input" placeholder="예: 30000" value="${state.dailyGoal || ''}"></div>
        <button id="save-goal-btn" style="flex:0 0 auto; width:auto; padding:10px 16px;">저장</button>
      </div>
      <div class="setup-note">한 번 설정하면 매일 같은 금액으로 적용돼요. 예산 탭의 카테고리 한도와는 별개예요.</div>
    </div>

    ${todayTxs.length > 0 ? `
    <div class="card">
      <h2>오늘 쓴 내역</h2>
      ${todayTxs.map(t => `
        <div class="recurring-item">
          <div><span class="cat-tag">${t.category}</span> ${t.method ? `(${t.method}) ` : ''}${t.memo || ''}</div>
          <div class="amt-expense">-${fmt(t.amount)}</div>
        </div>
      `).join('')}
    </div>
    <div class="setup-note" style="text-align:center;">이 내역은 "내역" 탭에도 그대로 반영돼요.</div>` : ''}
  `;
}

function renderHome() {
  const txs = getMonthTransactions(viewYear, viewMonth).slice().sort((a,b) => b.date.localeCompare(a.date));
  const income = txs.filter(t => t.type === 'income').reduce((s,t) => s+t.amount, 0);
  const expense = txs.filter(t => t.type === 'expense').reduce((s,t) => s+t.amount, 0);
  const net = income - expense;
  const netColor = net >= 0 ? 'var(--green)' : 'var(--red)';

  const rows = txs.map(t => `
    <tr>
      <td>${t.date.slice(5)}</td>
      <td><span class="cat-tag">${t.category}</span></td>
      <td>${t.type === 'expense' ? (t.method || '-') : '-'}</td>
      <td>${t.memo || '-'}</td>
      <td class="${t.type === 'expense' ? 'amt-expense' : 'amt-income'}">${t.type === 'expense' ? '-' : '+'}${fmt(t.amount)}</td>
      <td>
        <button class="del-btn" data-edit-id="${t.id}">✎</button>
        <button class="del-btn" data-id="${t.id}">✕</button>
      </td>
    </tr>
  `).join('');

  const editingTx = editingId ? state.transactions.find(t => t.id === editingId) : null;
  const selectedCat = editingTx ? editingTx.category : null;
  const catOptions = (currentType === 'expense' ? state.expenseCategories : INCOME_CATEGORIES)
    .map(c => `<option value="${c}" ${c===selectedCat?'selected':''}>${c}</option>`).join('');

  const selectedMethod = editingTx ? (editingTx.method || '카드') : '카드';
  const methodOptions = PAYMENT_METHODS.map(mth => `<option value="${mth}" ${mth===selectedMethod?'selected':''}>${mth}</option>`).join('');

  const formDate = editingTx ? editingTx.date : todayStr();
  const formAmount = editingTx ? editingTx.amount : '';
  const formMemo = editingTx ? (editingTx.memo || '') : '';

  return `
    <div class="card">
      <div class="month-nav">
        <button class="secondary" id="prev-month">◀</button>
        <div class="month-label">${viewYear}년 ${viewMonth}월</div>
        <button class="secondary" id="next-month">▶</button>
      </div>
      <div class="stat-grid">
        <div class="stat"><div class="label">수입</div><div class="value" style="color:var(--green)">${fmt(income)}</div></div>
        <div class="stat"><div class="label">지출</div><div class="value" style="color:var(--red)">${fmt(expense)}</div></div>
        <div class="stat"><div class="label">순액</div><div class="value" style="color:${netColor}">${net>=0?'+':''}${fmt(net)}</div></div>
      </div>
    </div>

    <div class="card">
      <h2>${editingTx ? '기록 수정' : '기록 추가'}</h2>
      <div class="type-toggle">
        <div class="type-btn expense ${currentType==='expense'?'active expense':''}" id="type-expense">지출</div>
        <div class="type-btn income ${currentType==='income'?'active income':''}" id="type-income">수입</div>
      </div>
      <div class="row">
        <div class="field"><label>날짜</label><input type="date" id="tx-date" value="${formDate}"></div>
        <div class="field"><label>카테고리</label><select id="tx-category">${catOptions}</select></div>
      </div>
      <div class="row">
        <div class="field"><label>금액</label><input type="number" id="tx-amount" placeholder="예: 50000" value="${formAmount}"></div>
        <div class="field"><label>메모 (선택)</label><input type="text" id="tx-memo" placeholder="예: 마트 장보기" value="${formMemo}"></div>
      </div>
      ${currentType === 'expense' ? `
      <div class="row">
        <div class="field"><label>결제수단</label><select id="tx-method">${methodOptions}</select></div>
      </div>` : ''}
      <button id="add-btn">${editingTx ? '수정 저장하기' : '추가하기'}</button>
      ${editingTx ? '<button class="secondary" id="cancel-edit-btn" style="margin-top:8px;">수정 취소</button>' : ''}
      <div id="add-error" class="err"></div>
    </div>

    <div class="card">
      <h2>카테고리별 지출</h2>
      <div class="chart-wrap"><canvas id="cat-chart"></canvas></div>
    </div>

    <div class="card">
      <h2>이번 달 내역</h2>
      ${txs.length === 0 ? '<div class="empty">이번 달 기록이 없어요</div>' : `
      <div class="tablewrap">
      <table>
        <thead><tr><th>날짜</th><th>분류</th><th>결제</th><th>메모</th><th>금액</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      </div>`}
    </div>
  `;
}

function renderBudget() {
  const txs = getMonthTransactions(viewYear, viewMonth).filter(t => t.type === 'expense');
  const spentByCat = {};
  let totalSpent = 0;
  txs.forEach(t => { spentByCat[t.category] = (spentByCat[t.category]||0) + t.amount; totalSpent += t.amount; });

  const totalBudget = state.totalBudget || 0;
  const totalPct = totalBudget > 0 ? Math.min(100, (totalSpent/totalBudget)*100) : 0;
  const totalOver = totalBudget > 0 && totalSpent > totalBudget;
  const totalBarColor = totalOver ? 'var(--red)' : (totalPct > 80 ? 'var(--amber)' : 'var(--green)');

  const rows = state.expenseCategories.map(cat => {
    const limit = state.budgets[cat] || 0;
    const spent = spentByCat[cat] || 0;
    const pct = limit > 0 ? Math.min(100, (spent/limit)*100) : 0;
    const over = limit > 0 && spent > limit;
    const barColor = over ? 'var(--red)' : (pct > 80 ? 'var(--amber)' : 'var(--green)');
    return `
      <div class="budget-row">
        <div class="top">
          <span>${cat}</span>
          <span style="color:${over ? 'var(--red)' : 'var(--muted)'}">${fmt(spent)} ${limit>0 ? '/ ' + fmt(limit) : '(한도 미설정)'}</span>
        </div>
        ${limit > 0 ? `<div class="bar-bg"><div class="bar-fill" style="width:${pct}%; background:${barColor};"></div></div>` : ''}
      </div>
    `;
  }).join('');

  const limitInputs = state.expenseCategories.map(cat => `
    <div class="row" style="align-items:center;">
      <div class="field" style="flex:0 0 90px;"><label style="margin:0;">${cat}</label></div>
      <div class="field">
        <input type="number" class="budget-input" data-cat="${cat}" placeholder="한도 없음" value="${state.budgets[cat] || ''}">
      </div>
      <button class="del-btn" data-del-cat="${cat}" style="flex:0 0 auto;">✕</button>
    </div>
  `).join('');

  return `
    <div class="card">
      <h2>${viewYear}년 ${viewMonth}월 총 예산</h2>
      <div class="budget-row" style="margin-bottom:0;">
        <div class="top">
          <span style="font-weight:700;">전체 지출</span>
          <span style="color:${totalOver ? 'var(--red)' : 'var(--text)'}; font-weight:700;">${fmt(totalSpent)} ${totalBudget>0 ? '/ ' + fmt(totalBudget) : '(한도 미설정)'}</span>
        </div>
        ${totalBudget > 0 ? `<div class="bar-bg"><div class="bar-fill" style="width:${totalPct}%; background:${totalBarColor};"></div></div>` : ''}
      </div>
    </div>

    <div class="card">
      <h2>${viewYear}년 ${viewMonth}월 카테고리별 예산 현황</h2>
      ${rows}
    </div>
    <div class="card">
      <h2>총 예산 한도 설정</h2>
      <input type="number" id="total-budget-input" placeholder="한도 없음" value="${state.totalBudget || ''}">
      <button id="save-total-budget-btn" style="margin-top:10px;">저장</button>
      <div class="setup-note">카테고리별 한도와 별개로, 이번 달 전체 지출에 대한 한도예요.</div>
    </div>
    <div class="card">
      <h2>카테고리별 월 한도 설정</h2>
      ${limitInputs}
      <button id="save-budget-btn" style="margin-top:10px;">저장</button>
      <div class="setup-note">한 번 설정하면 매달 동일하게 적용돼요. 한도를 비워두면 관리 안 함으로 처리돼요.</div>
    </div>
    <div class="card">
      <h2>카테고리 추가</h2>
      <div class="row">
        <div class="field"><input type="text" id="new-cat-input" placeholder="예: 반려동물"></div>
        <button id="add-cat-btn" style="flex:0 0 auto; width:auto; padding:10px 16px;">추가</button>
      </div>
      <div id="cat-error" class="err"></div>
      <div class="setup-note">카테고리를 삭제해도 이미 기록된 내역의 분류는 그대로 남아요. 다만 새 기록에는 더 이상 선택할 수 없게 돼요.</div>
    </div>
  `;
}

function renderRecurring() {
  const items = state.recurring.map(r => `
    <div class="recurring-item">
      <div>
        <div><span class="cat-tag">${r.category}</span> ${r.memo || ''}</div>
        <div style="color:var(--muted); font-size:11px; margin-top:2px;">매달 ${r.day >= 29 ? '말일' : r.day + '일'} · ${fmt(r.amount)}</div>
      </div>
      <button class="del-btn" data-recurring-id="${r.id}">✕</button>
    </div>
  `).join('');

  return `
    <div class="banner">고정비를 등록해두면 매달 해당 날짜가 지날 때 자동으로 지출 기록에 추가돼요 (앱을 열 때 확인합니다). 날짜를 31로 입력하면 그 달의 마지막 날(28~31일)로 자동 맞춰져요.</div>
    <div class="card">
      <h2>고정비 추가</h2>
      <div class="row">
        <div class="field"><label>카테고리</label>
          <select id="rec-category">${state.expenseCategories.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        </div>
        <div class="field"><label>매달 며칠 (말일은 31로)</label><input type="number" id="rec-day" min="1" max="31" placeholder="예: 1"></div>
      </div>
      <div class="row">
        <div class="field"><label>금액</label><input type="number" id="rec-amount" placeholder="예: 500000"></div>
        <div class="field"><label>메모 (선택)</label><input type="text" id="rec-memo" placeholder="예: 월세"></div>
      </div>
      <button id="add-recurring-btn">고정비 등록</button>
      <div id="recurring-error" class="err"></div>
    </div>
    <div class="card">
      <h2>등록된 고정비</h2>
      ${state.recurring.length === 0 ? '<div class="empty">등록된 고정비가 없어요</div>' : items}
    </div>
  `;
}

function renderTrend() {
  return `
    <div class="card">
      <h2>최근 6개월 수입·지출 추이</h2>
      <div class="chart-wrap"><canvas id="trend-chart"></canvas></div>
    </div>
  `;
}

function drawCatChart() {
  const ctx = document.getElementById('cat-chart');
  if (!ctx) return;
  const txs = getMonthTransactions(viewYear, viewMonth).filter(t => t.type === 'expense');
  const byCat = {};
  txs.forEach(t => { byCat[t.category] = (byCat[t.category]||0) + t.amount; });
  const labels = Object.keys(byCat);
  const data = Object.values(byCat);
  const colors = ['#4f8cff','#ff5d5d','#34c77b','#f5b942','#a78bfa','#f472b6','#38bdf8','#fb923c','#94a3b8'];

  if (chartInstance) chartInstance.destroy();
  if (labels.length === 0) return;

  chartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 0 }] },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#e8e9ec', font: { size: 11 }, boxWidth: 12 } },
        tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${fmt(ctx.parsed)}` } }
      }
    }
  });
}

function drawTrendChart() {
  const ctx = document.getElementById('trend-chart');
  if (!ctx) return;
  const labels = [];
  const incomeData = [];
  const expenseData = [];
  let y = viewYear, m = viewMonth;
  const months = [];
  for (let i = 0; i < 6; i++) {
    months.unshift({y, m});
    m--; if (m < 1) { m = 12; y--; }
  }
  months.forEach(({y,m}) => {
    const txs = getMonthTransactions(y, m);
    labels.push(`${m}월`);
    incomeData.push(txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0));
    expenseData.push(txs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0));
  });

  if (trendChartInstance) trendChartInstance.destroy();
  trendChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: '수입', data: incomeData, backgroundColor: '#34c77b' },
        { label: '지출', data: expenseData, backgroundColor: '#ff5d5d' }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { color: '#e8e9ec', font: { size: 11 } } },
        tooltip: { callbacks: { label: (ctx) => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` } }
      },
      scales: {
        x: { ticks: { color: '#9aa1af' }, grid: { color: '#2a2f3a' } },
        y: { ticks: { color: '#9aa1af' }, grid: { color: '#2a2f3a' } }
      }
    }
  });
}

function attachHandlers() {
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => { activeTab = tab.dataset.tab; render(); });
  });

  document.getElementById('export-btn').onclick = () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `budget_backup_${todayStr()}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };
  document.getElementById('import-btn').onclick = () => document.getElementById('import-file').click();
  document.getElementById('import-file').onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const msgEl = document.getElementById('import-msg');
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const loaded = JSON.parse(evt.target.result);
        if (!Array.isArray(loaded.transactions)) { if (msgEl) msgEl.textContent = '올바른 백업 파일이 아니에요.'; return; }
        state = loaded;
        if (!state.budgets) state.budgets = {};
        if (!state.recurring) state.recurring = [];
        if (!state.expenseCategories) state.expenseCategories = EXPENSE_CATEGORIES_DEFAULT.slice();
        saveState(); render();
      } catch (err) { if (msgEl) msgEl.textContent = '파일을 읽는 중 오류가 발생했어요.'; }
    };
    reader.readAsText(file);
  };

  if (activeTab === 'today') {
    document.getElementById('save-goal-btn').onclick = () => {
      const val = parseFloat(document.getElementById('daily-goal-input').value);
      if (!isNaN(val) && val > 0) state.dailyGoal = val;
      else delete state.dailyGoal;
      saveState(); render();
    };

    document.getElementById('today-add-btn').onclick = () => {
      const category = document.getElementById('today-category').value;
      const method = document.getElementById('today-method').value;
      const amount = parseFloat(document.getElementById('today-amount').value);
      const memo = document.getElementById('today-memo').value.trim();
      const errEl = document.getElementById('today-error');
      errEl.textContent = '';
      if (!amount || amount <= 0) { errEl.textContent = '금액을 입력해주세요.'; return; }
      state.transactions.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        date: todayStr(), type: 'expense', category, amount, memo, method
      });
      saveState(); render();
    };
  }

  if (activeTab === 'home') {
    document.getElementById('prev-month').onclick = () => { viewMonth--; if (viewMonth<1){viewMonth=12;viewYear--;} render(); };
    document.getElementById('next-month').onclick = () => { viewMonth++; if (viewMonth>12){viewMonth=1;viewYear++;} render(); };
    document.getElementById('type-expense').onclick = () => { currentType='expense'; render(); };
    document.getElementById('type-income').onclick = () => { currentType='income'; render(); };

    document.getElementById('add-btn').onclick = () => {
      const date = document.getElementById('tx-date').value;
      const category = document.getElementById('tx-category').value;
      const amount = parseFloat(document.getElementById('tx-amount').value);
      const memo = document.getElementById('tx-memo').value.trim();
      const methodEl = document.getElementById('tx-method');
      const method = currentType === 'expense' ? (methodEl ? methodEl.value : '카드') : undefined;
      const errEl = document.getElementById('add-error');
      errEl.textContent = '';
      if (!date) { errEl.textContent = '날짜를 입력해주세요.'; return; }
      if (!amount || amount <= 0) { errEl.textContent = '금액을 입력해주세요.'; return; }

      if (editingId) {
        const tx = state.transactions.find(t => t.id === editingId);
        if (tx) {
          tx.date = date; tx.type = currentType; tx.category = category; tx.amount = amount; tx.memo = memo;
          if (currentType === 'expense') tx.method = method; else delete tx.method;
        }
        editingId = null;
      } else {
        const newTx = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
          date, type: currentType, category, amount, memo
        };
        if (currentType === 'expense') newTx.method = method;
        state.transactions.push(newTx);
      }
      saveState();
      const [y, m] = date.split('-').map(Number);
      viewYear = y; viewMonth = m;
      render();
    };

    if (document.getElementById('cancel-edit-btn')) {
      document.getElementById('cancel-edit-btn').onclick = () => {
        editingId = null;
        render();
      };
    }

    document.querySelectorAll('.del-btn[data-edit-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tx = state.transactions.find(t => t.id === btn.dataset.editId);
        if (tx) {
          editingId = tx.id;
          currentType = tx.type;
          render();
        }
      });
    });

    document.querySelectorAll('.del-btn[data-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.transactions = state.transactions.filter(t => t.id !== btn.dataset.id);
        if (editingId === btn.dataset.id) editingId = null;
        saveState(); render();
      });
    });
  }

  if (activeTab === 'budget') {
    document.getElementById('save-total-budget-btn').onclick = () => {
      const val = parseFloat(document.getElementById('total-budget-input').value);
      if (!isNaN(val) && val > 0) state.totalBudget = val;
      else delete state.totalBudget;
      saveState(); render();
    };

    document.getElementById('save-budget-btn').onclick = () => {
      document.querySelectorAll('.budget-input').forEach(inp => {
        const cat = inp.dataset.cat;
        const val = parseFloat(inp.value);
        if (!isNaN(val) && val > 0) state.budgets[cat] = val;
        else delete state.budgets[cat];
      });
      saveState(); render();
    };

    document.getElementById('add-cat-btn').onclick = () => {
      const input = document.getElementById('new-cat-input');
      const name = input.value.trim();
      const errEl = document.getElementById('cat-error');
      errEl.textContent = '';
      if (!name) { errEl.textContent = '카테고리 이름을 입력해주세요.'; return; }
      if (state.expenseCategories.includes(name)) { errEl.textContent = '이미 있는 카테고리예요.'; return; }
      state.expenseCategories.push(name);
      saveState(); render();
    };

    document.querySelectorAll('.del-btn[data-del-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.dataset.delCat;
        state.expenseCategories = state.expenseCategories.filter(c => c !== cat);
        delete state.budgets[cat];
        saveState(); render();
      });
    });
  }

  if (activeTab === 'recurring') {
    document.getElementById('add-recurring-btn').onclick = () => {
      const category = document.getElementById('rec-category').value;
      const day = parseInt(document.getElementById('rec-day').value);
      const amount = parseFloat(document.getElementById('rec-amount').value);
      const memo = document.getElementById('rec-memo').value.trim();
      const errEl = document.getElementById('recurring-error');
      errEl.textContent = '';
      if (!day || day < 1 || day > 31) { errEl.textContent = '날짜는 1~31 사이로 입력해주세요.'; return; }
      if (!amount || amount <= 0) { errEl.textContent = '금액을 입력해주세요.'; return; }
      state.recurring.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        category, day, amount, memo
      });
      saveState(); render();
    };
    document.querySelectorAll('.del-btn[data-recurring-id]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.recurring = state.recurring.filter(r => r.id !== btn.dataset.recurringId);
        saveState(); render();
      });
    });
  }
}

loadState();
applyRecurring();
render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => console.log('SW 등록 실패', err));
  });
}
</script>
</body>
</html>
